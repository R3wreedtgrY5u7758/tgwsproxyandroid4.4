plugins {
    id 'com.android.application'
}

android {
    namespace 'com.amurcanov.tgwsproxy'
    compileSdk 34

    defaultConfig {
        applicationId 'com.amurcanov.tgwsproxy.kitkat'
        minSdk 19
        targetSdk 28
        versionCode 124
        versionName '1.2.4-kitkat'

        // Для 4.4 нужен только 32-битный ARM; нативная либа собирается под API 19.
        ndk {
            abiFilters 'armeabi-v7a'
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    sourceSets {
        main {
            jniLibs.srcDirs = ['src/main/jniLibs']
        }
    }

    packaging {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

dependencies {
    // JNA — мост к C-функциям libtgwsproxy.so (как и в оригинале).
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}
